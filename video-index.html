        function getVideoName(url) {
            try {
                const urlObj = new URL(url);
                const pathname = urlObj.pathname;
                const filename = pathname.split('/').pop();
                return decodeURIComponent(filename);
            } catch (e) {
                return url;
            }
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

                    const tileInfo = document.createElement('div');
                    tileInfo.className = 'tile-info';

                    const typeItem = document.createElement('div');
                    typeItem.className = 'info-item';
                    typeItem.innerHTML = `<span class="info-label">Type:</span> ${tile.type}`;
                    tileInfo.appendChild(typeItem);

                    if (tile.address) {
                        const addressItem = document.createElement('div');
                        addressItem.className = 'info-item';
                        addressItem.innerHTML = `<span class="info-label">Address:</span> ${tile.address}`;
                        tileInfo.appendChild(addressItem);
                    }

                    if (tile.price) {
                        const priceItem = document.createElement('div');
                        priceItem.className = 'info-item';
                        priceItem.innerHTML = `<span class="info-label">Price:</span> $${tile.price}`;
                        tileInfo.appendChild(priceItem);
                    }

                    tileBox.appendChild(tileInfo);

                    const videoList = document.createElement('div');
                    videoList.className = 'video-list';

                    const videoHeader = document.createElement('div');
                    videoHeader.className = 'video-header';
                    videoHeader.innerHTML = `📹 Videos <span class="video-count">${tile.videos.length}</span>`;
                    videoList.appendChild(videoHeader);

                    tile.videos.forEach((videoUrl, index) => {
                        const videoItem = document.createElement('div');
                        videoItem.className = 'video-item';

                        const videoName = document.createElement('div');
                        videoName.className = 'video-name';
                        videoName.textContent = `${index + 1}. ${getVideoName(videoUrl)}`;

                        const videoUrlContainer = document.createElement('div');
                        videoUrlContainer.className = 'video-url-container';

                        const videoLink = document.createElement('a');
                        videoLink.className = 'video-link';
                        videoLink.href = videoUrl;
                        videoLink.target = '_blank';
                        videoLink.textContent = videoUrl;

                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'copy-btn';
                        copyBtn.textContent = 'Copy';
                        copyBtn.onclick = () => copyToClipboard(videoUrl, copyBtn);

                        videoUrlContainer.appendChild(videoLink);
                        videoUrlContainer.appendChild(copyBtn);

                        videoItem.appendChild(videoName);
                        videoItem.appendChild(videoUrlContainer);
                        videoList.appendChild(videoItem);
                    });

                    tileBox.appendChild(videoList);
                    container.appendChild(tileBox);
                }
            });
        }

        renderTiles();
    </script>
</body>
</html>
